server:
  port: 8080

spring:
  application:
    name: personal-homepage

  # 本地私密配置（不入代码库）：读取运行目录下的 application-local.yml
  config:
    import: optional:file:./application-local.yml

  # MySQL/MariaDB 数据源（生产环境通过环境变量或 application-local.yml 覆盖）
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/homepage?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  # 开发环境配置
  devtools:
    restart:
      enabled: true

# 日志配置
logging:
  level:
    com.homepage: DEBUG
    org.springframework: INFO
